steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'asia-southeast3-docker.pkg.dev/sixth-storm-439008-u2/sigroom-repo/sigroom:latest'
      - '.'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'asia-southeast3-docker.pkg.dev/sixth-storm-439008-u2/sigroom-repo/sigroom:latest'

  # deploy อัตโนมัติหลัง build+push สำเร็จ — ไม่ตั้ง --set-env-vars เพื่อให้ env vars
  # เดิมที่ตั้งไว้บน Cloud Run service อยู่แล้วไม่ถูกล้าง
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'sigroom'
      - '--image=asia-southeast3-docker.pkg.dev/sixth-storm-439008-u2/sigroom-repo/sigroom:latest'
      - '--region=asia-southeast3'
      - '--quiet'

images:
  - 'asia-southeast3-docker.pkg.dev/sixth-storm-439008-u2/sigroom-repo/sigroom:latest'

options:
  logging: CLOUD_LOGGING_ONLY
