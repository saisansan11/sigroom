<title>SIGROOM</title>
<style>
:root{--paper:#F5F1E6;--ink:#1F2A24;--stamp:#A3241C;--rule:#D8CFB8}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--paper);color:var(--ink);font-family:"Sarabun","IBM Plex Sans Thai",Tahoma,sans-serif;display:flex;align-items:center;justify-content:center;
background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 31px,var(--rule) 31px,var(--rule) 32px)}
main{width:min(92vw,420px);text-align:center;padding:32px 24px;background:var(--paper);border:1px solid var(--rule);box-shadow:0 1px 0 var(--rule)}
.mark{display:block;width:96px;height:96px;margin:0 auto 10px}
svg{width:200px;height:auto;display:block;margin:0 auto 12px}
.draw{fill:none;stroke:var(--ink);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:420;stroke-dashoffset:420;animation:ink 2.2s ease-out .2s forwards}
.stamp{fill:none;stroke:var(--stamp);stroke-width:2.5;stroke-dasharray:90;stroke-dashoffset:90;animation:ink 1s ease-out 2.2s forwards}
@keyframes ink{to{stroke-dashoffset:0}}
h1{margin:0;font-size:2rem;letter-spacing:.18em;font-weight:700}
h1 span{color:var(--stamp)}
.sub{margin:6px 0 20px;font-size:1rem}
.status{margin:0;font-size:1.05rem;border-top:1px solid var(--rule);padding-top:16px}
.hint{margin:10px 0 0;font-size:.9rem;min-height:2.6em;color:var(--stamp);visibility:hidden}
.hint.show{visibility:visible}
a{color:var(--stamp)}
@media (prefers-reduced-motion:reduce){.draw,.stamp{animation:none;stroke-dashoffset:0}}
</style>
</head>
