{% if time_presets %}
{# ปุ่มช่วงเวลาสำเร็จรูป (งาน C) — ตัวช่วยกรอกเท่านั้น ไม่ใช่กฎธุรกิจ จึงใช้ JS เล็กในเทมเพลตได้ #}
{# ห้ามใส่ partial นี้ในโหมดสรุปการจอง (date/start/end เป็น hidden) — ค่าจะไม่ตรงกับข้อความสรุป #}
<div class="time-preset-row" role="group" aria-label="ช่วงเวลาสำเร็จรูป">
  <span class="time-preset-label">เลือกเร็ว:</span>
  {% for preset in time_presets %}
    <button type="button" class="time-preset-button" data-start="{{ preset.start }}" data-end="{{ preset.end }}">{{ preset.label }} {{ preset.start }}–{{ preset.end }}</button>
  {% endfor %}
</div>
<script>
(function () {
  document.currentScript.previousElementSibling.addEventListener('click', function (event) {
    const button = event.target.closest('.time-preset-button');
    if (!button) return;
    const form = button.closest('form');
    const startField = form.querySelector('[name="start"], [name="start_time"]');
    const endField = form.querySelector('[name="end"], [name="end_time"]');
    if (startField) startField.value = button.dataset.start;
    if (endField) endField.value = button.dataset.end;
  });
})();
</script>
{% endif %}
