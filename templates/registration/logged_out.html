{% extends "base.html" %}

      <g stroke="var(--line)" fill="none">
        <circle cx="200" cy="200" r="70"/><circle cx="200" cy="200" r="120"/>

    <a role="button" href="{% url 'login' %}">เข้าสู่ระบบอีกครั้ง</a>
  </section>
</div>
{% endblock %}
