{% extends "base.html" %}
{% block title %}ตั้งรหัสผ่านใหม่ — SIGROOM{% endblock %}
{% block content %}
<article class="auth-card">
  <h1>ตั้งรหัสผ่านของคุณ</h1>
  <p>บัญชีนี้ยังใช้รหัสเริ่มต้น กรุณาตั้งรหัสผ่านใหม่ก่อนเข้าใช้งานระบบ</p>
  <form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit">บันทึกรหัสผ่านใหม่</button>
  </form>
</article>
{% endblock %}
