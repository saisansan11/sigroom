[project]
name = "ogn-room"
version = "0.1.0"
description = "ระบบจองและบริหารการใช้ห้อง โรงเรียนทหารสื่อสาร"
requires-python = ">=3.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2",
    "python-dotenv>=1.0",
    "django-htmx>=1.19",
    "argon2-cffi>=23",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["tests.py", "test_*.py"]
